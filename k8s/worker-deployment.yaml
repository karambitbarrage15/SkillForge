apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamforge-worker
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamforge-worker
  template:
    metadata:
      labels:
        app: streamforge-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: worker
          image: skillforge-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: streamforge-config
            - secretRef:
                name: streamforge-secret
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-worker
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app: streamforge-worker
