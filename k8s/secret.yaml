apiVersion: v1
kind: Secret
metadata:
  name: streamforge-secret
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge
type: Opaque
stringData:
  DATABASE_URL: "postgres://streamforge:password@postgres:5432/streamforge?sslmode=disable"
  REDIS_URL: "redis://redis:6379/0"
  POSTGRES_USER: "streamforge"
  POSTGRES_PASSWORD: "password"
  POSTGRES_DB: "streamforge"
