databases:
  - name: streamforge-db
    databaseName: streamforge
    user: streamforge
    plan: free

services:
  # 1. Go API Web Service
  - type: web
    name: streamforge-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerTarget: api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: streamforge-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: HTTP_PORT
        value: 10000
      - key: HTTP_METRICS_PORT
        value: 9090

  # 2. Worker Pool (Runs as free web service with metrics on port 10000)
  - type: web
    name: streamforge-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerTarget: worker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: streamforge-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: HTTP_METRICS_PORT
        value: 10000
      - key: WORKER_COUNT
        value: 4

  # 3. React Frontend Dashboard (Static Site - Free CDN)
  - type: web
    name: streamforge-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_WS_URL
        sync: false
