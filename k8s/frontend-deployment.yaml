apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamforge-frontend
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamforge-frontend
  template:
    metadata:
      labels:
        app: streamforge-frontend
    spec:
      containers:
        - name: frontend
          image: skillforge-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: streamforge-frontend
